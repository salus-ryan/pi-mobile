<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pi Mobile</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css?v=2">
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">π</span><span>Pi Mobile</span></div>
    <div class="top-actions">
      <button id="thinkingButton" class="chip" title="Change thinking level">medium</button>
      <button id="modelButton" class="chip" title="Cycle model">model</button>
      <button id="newButton" class="icon-button" title="New session" aria-label="New session">＋</button>
    </div>
  </header>

  <div id="statusbar" class="statusbar">
    <span id="connectionDot" class="dot"></span>
    <span id="connectionText">Connecting…</span>
    <span class="spacer"></span>
    <span id="cwdText"></span>
  </div>

  <main id="conversation" aria-live="polite">
    <section id="emptyState" class="empty-state">
      <div class="empty-logo">π</div>
      <h1>What should we build?</h1>
      <p>Pi is running locally in Termux.</p>
    </section>
    <div id="messages"></div>
    <section id="activity" class="activity hidden">
      <div class="activity-title"><span class="spinner"></span><span id="activityTitle">Working</span></div>
      <div id="toolEvents"></div>
    </section>
  </main>

  <section id="attachmentTray" class="attachment-tray hidden"></section>

  <form id="composer" class="composer">
    <div class="composer-box">
      <textarea id="prompt" rows="1" placeholder="Message Pi…" aria-label="Message Pi"></textarea>
      <div class="composer-actions">
        <label class="attach-button" title="Attach image">
          <input id="imageInput" type="file" accept="image/*" multiple>
          <span>＋</span>
        </label>
        <button id="stopButton" type="button" class="send-button stop hidden" aria-label="Stop">■</button>
        <button id="sendButton" type="submit" class="send-button" aria-label="Send">↑</button>
      </div>
    </div>
    <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
  </form>

  <div id="dialogBackdrop" class="dialog-backdrop hidden" role="presentation">
    <section id="dialog" class="dialog" role="dialog" aria-modal="true">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <div id="dialogBody"></div>
      <div id="dialogActions" class="dialog-actions"></div>
    </section>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
  <script src="/vendor/katex/katex.min.js?v=2"></script>
  <script type="module" src="/app.js?v=2"></script>
</body>
</html>
